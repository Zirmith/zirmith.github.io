<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} · {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <div class="brand">{{ site.title }}</div>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="https://github.com/Zirmith">GitHub</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <article class="card">
        {{ content }}
      </article>

      <footer class="foot">
        <div class="muted">© {{ site.time | date: '%Y' }} {{ site.title }} · built on GitHub Pages</div>
      </footer>
    </main>
  </body>
</html>
